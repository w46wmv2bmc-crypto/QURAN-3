<body>

<header>
  <h1>📖 قورئانی پیرۆز</h1>
  <p>بە ناوی خوای بەخشندە و میهرەبان</p>
</header>

<main>
  <input id="search" placeholder="گەڕان بە ناوی سوورەت..." />
  <div id="message">تکایە چاوەڕێ بکە...</div>
  <div id="list"></div>

  <section id="reader" hidden>
    <button id="back">⬅ گەڕانەوە بۆ سوورەتەکان</button>
    <h2 id="surahTitle"></h2>
    <div id="verses"></div>
  </section>
</main>

<script>
const list = document.getElementById("list");
const message = document.getElementById("message");
const search = document.getElementById("search");
const reader = document.getElementById("reader");
const verses = document.getElementById("verses");

let surahs = [];
let audio = new Audio();

async function loadSurahs() {
  try {
    const response = await fetch("https://api.alquran.cloud/v1/surah");
    const data = await response.json();
    if (data.code !== 200) throw new Error();
    surahs = data.data;
    message.textContent = "سوورەتێک هەڵبژێرە";
    showSurahs(surahs);
  } catch (error) {
    message.textContent = "هەڵە لە پەیوەندی ئینتەرنێت. تکایە دووبارە هەوڵ بدە.";
  }
}

function showSurahs(items) {
  list.innerHTML = "";
  items.forEach(surah => {
    const button = document.createElement("button");
    button.className = "surah";
    button.textContent =
      surah.number + " - " + surah.name + " (" +
      surah.englishName + ")";
    button.onclick = () => openSurah(surah);
    list.appendChild(button);
  });
}

search.addEventListener("input", () => {
  const word = search.value.trim().toLowerCase();
  showSurahs(surahs.filter(s =>
    s.name.includes(word) ||
    s.englishName.toLowerCase().includes(word) ||
    String(s.number).includes(word)
  ));
});

async function openSurah(surah) {
  list.hidden = true;
  search.hidden = true;
  reader.hidden = false;
  document.getElementById("surahTitle").textContent =
    surah.name + " - " + surah.englishName;
  verses.innerHTML = "تکایە چاوەڕێ بکە...";
  
  try {
    const [textResponse, audioResponse] = await Promise.all([
      fetch("https://api.alquran.cloud/v1/surah/" + surah.number + "/quran-uthmani"),
      fetch("https://api.alquran.cloud/v1/surah/" + surah.number + "/ar.alafasy")
    ]);

    const textData = await textResponse.json();
    const audioData = await audioResponse.json();

    if (textData.code !== 200 || audioData.code !== 200)
      throw new Error();

    verses.innerHTML = "";

    textData.data.ayahs.forEach((ayah, index) => {
      const audioAyah = audioData.data.ayahs[index];
      const box = document.createElement("div");
      box.className = "ayah";

      const text = document.createElement("div");
      text.textContent = ayah.text + " ۞ ";

      const number = document.createElement("p");
      number.textContent = "ئایەتی " + ayah.numberInSurah;

      const play = document.createElement("button");
      play.textContent = "▶ گوێگرتن";
      play.onclick = () => {
        audio.src = audioAyah.audio;
        audio.play();
      };

      box.appendChild(text);
      box.appendChild(number);
      box.appendChild(play);
      verses.appendChild(box);
    });

  } catch (error) {
    verses.textContent = "نەتوانرا سوورەتەکە باربکرێت. ئینتەرنێتەکەت بپشکنە.";
  }
}

document.getElementById("back").onclick = () => {
  audio.pause();
  reader.hidden = true;
  list.hidden = false;
  search.hidden = false;
};

loadSurahs();
</script>
</body>
