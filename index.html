
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قورئانی پیرۆز</title>
<style>.ayah p:not(.translation) {
  display: inline-block;
  color: white;
  background: #08784e;
  padding: 8px 20px;
  border-radius: 25px;
  font-size: 18px;
  margin: 15px 0;
}
  .translation {
  color: #286b45;
  font-size: 18px;
  line-height: 2;
  text-align: right;
  padding: 10px;
  background: #f0f8f1;
  border-radius: 10px;
  margin-top: 10px;
}
body {
  margin: 0;
  background: #f2f7f2;
  color: #173d2b;
  font-family: sans-serif;
}
header {
  background: #075b3b;
  color: white;
  text-align: center;
  padding: 25px 10px;
}
header h1 { margin: 5px; }
main {
  padding: 15px;
  max-width: 700px;
  margin: auto;
}
input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border: 1px solid #aaa;
  border-radius: 10px;
  font-size: 17px;
  margin-bottom: 15px;
}
button {
  background: #087448;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
}
.surah {
  display: block;
  width: 100%;
  margin: 7px 0;
  text-align: right;
  background: white;
  color: #174b32;
  border: 1px solid #d5e5d9;
}
.ayah {
  background: white;
  color: #173d2b;
  padding: 18px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 2.2;
  font-size: 25px;
  text-align: center;
  direction: rtl;
}
.ayah button { font-size: 14px; }
#message {
  text-align: center;
  padding: 12px;
}
#back { margin-bottom: 12px; }
.ayah button {
  background: #08784e;
  color: white;
  border: none;
  border-radius: 25px;
  padding: 10px 22px;
  font-size: 16px;
  cursor: pointer;
  margin: 10px 0;
}

.ayah button:active {
  background: #064d35;
  transform: scale(0.96);
}
</style>
</head>
<body><footer>
  دروستکراوە لەلایەن
  <strong>Ahmad Suleman Masih</strong>
</footer>

<header>
  <h1>📖 قورئانی پیرۆز</h1>
  <p>بە ناوی خوای بەخشندە و میهرەبان</p>
</header>

<main>
  <input id="search" placeholder="گەڕان بە ناوی سوورەت..." />
  <div id="message">تکایە چاوەڕێ بکە...</div>
  <div id="list"></div>

  <section id="reader" hidden>
    <button id="back">⬅ گەڕانەوە بۆ سوورەتەکان</button>
    <h2 id="surahTitle"></h2>
    <div id="verses"></div>
  </section>
</main>

<script>
const list = document.getElementById("list");
const message = document.getElementById("message");
const search = document.getElementById("search");
const reader = document.getElementById("reader");
const verses = document.getElementById("verses");

let surahs = [];
let audio = new Audio();

async function loadSurahs() {
  try {
    const response = await fetch(
      "https://api.alquran.cloud/v1/surah"
    );
    const data = await response.json();

    if (data.code !== 200) throw new Error();

    surahs = data.data;
    message.textContent = "سوورەتێک هەڵبژێرە";
    showSurahs(surahs);
  } catch (error) {
    message.textContent =
      "هەڵە لە پەیوەندی ئینتەرنێت. تکایە دووبارە هەوڵ بدە.";
  }
}

function showSurahs(items) {
  list.innerHTML = "";

  items.forEach(surah => {
    const button = document.createElement("button");
    button.className = "surah";
    button.textContent =
      surah.number + " - " + surah.name +
      " (" + surah.englishName + ")";

    button.onclick = () => openSurah(surah);
    list.appendChild(button);
  });
}

search.addEventListener("input", () => {
  const word = search.value.trim().toLowerCase();

  showSurahs(surahs.filter(s =>
    s.name.includes(word) ||
    s.englishName.toLowerCase().includes(word) ||
    String(s.number).includes(word)
  ));
});

async function openSurah(surah) {
  list.hidden = true;
  search.hidden = true;
  reader.hidden = false;

  document.getElementById("surahTitle").textContent =
    surah.name + " - " + surah.englishName;

  verses.innerHTML = "تکایە چاوەڕێ بکە...";

  try {
    // سەرەتا تەنها دەقی قورئان بار دەکەین
    const textResponse = await fetch(
      "https://api.alquran.cloud/v1/surah/" + surah.number
    );

    const textData = await textResponse.json();
const translationResponse = await fetch(
  "https://quranenc.com/api/v1/translation/sura/kurdish_bamoki/" + surah.number
);
const translationData = await translationResponse.json();
    console.log(translationData);
    if (textData.code !== 200) throw new Error();

    verses.innerHTML = "";

    // دەقی ئایەتەکان نیشان دەدەین
textData.data.ayahs.forEach((ayah, index) => {
      const box = document.createElement("div");
      box.className = "ayah";

      const text = document.createElement("div");
text.textContent = ayah.text + " ۞ ";

const translation = document.createElement("p");
translation.textContent =
  translationData.result[index]?.translation || "وەرگێڕان بەردەست نییە";
translation.className = "translation";

      const number = document.createElement("p");
      number.textContent = "ئایەتی " + ayah.numberInSurah;

      const play = document.createElement("button");
      play.textContent = "▶ چاوەڕێی دەنگ...";

      box.appendChild(text);
      box.appendChild(translation);

      box.appendChild(number);
      box.appendChild(play);
      verses.appendChild(box);

      play.disabled = true;
    });

    // دوای نیشاندانی دەق، دەنگ بە جیا بار دەکەین
    try {
      const audioResponse = await fetch(
        "https://api.alquran.cloud/v1/surah/" +
        surah.number + "/ar.alafasy"
      );

      const audioData = await audioResponse.json();

      if (audioData.code === 200) {
        const boxes = verses.querySelectorAll(".ayah");

        audioData.data.ayahs.forEach((ayah, index) => {
          const play = boxes[index]?.querySelector("button");

          if (!play || !ayah.audio) return;

          play.disabled = false;
          play.textContent = "▶ گوێگرتن";

          play.onclick = () => {
  if (audio.src === ayah.audio && !audio.paused) {
    audio.pause();
    play.textContent = "▶ بەردەوامبوون";
  } else if (audio.src === ayah.audio && audio.paused) {
    audio.play();
    play.textContent = "⏸ وەستاندن";
  } else {
    audio.src = ayah.audio;
    audio.play();
    play.textContent = "⏸ وەستاندن";
  }
};
          };
        });
      }
    } catch (audioError) {
      verses.querySelectorAll(".ayah button").forEach(button => {
        button.textContent = "دەنگ بەردەست نییە";
      });
    }

  } catch (error) {
    verses.textContent =
      "نەتوانرا دەقی سوورەتەکە باربکرێت. ئینتەرنێتەکەت بپشکنە.";
  }
}

document.getElementById("back").onclick = () => {
  audio.pause();
  reader.hidden = true;
  list.hidden = false;
  search.hidden = false;
};

loadSurahs();
</script>

</body>
</html>
